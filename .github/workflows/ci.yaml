name: Go checks
on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: scripts/check-format.sh
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Check protobuf lint and deterministic generation
        run: python3 scripts/check-generation.py
      - name: Vet
        run: go vet ./...
      - name: Check runtime concurrency
        run: go test -race ./...
      - name: Expose pinned local generators for consumer acceptance
        run: mise run local-plugins
      - name: Check complete consumer CLI workflow
        run: python3 scripts/check-workflow.py --local-plugins .tools/plugins
      - name: Build release targets
        run: python3 scripts/build-release.py --version v0.0.0-ci
