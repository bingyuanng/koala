name: Go checks
on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mise for CLI tests
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false
          add_shims_to_path: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: scripts/check-format.sh
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  race:
    name: Race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install mise for CLI tests
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false
          add_shims_to_path: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check runtime concurrency
        run: go test -race ./...

  generation:
    name: Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: buf
          add_shims_to_path: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check protobuf lint and deterministic generation
        run: go run ./scripts/check-generation

  acceptance:
    name: Acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Expose pinned local generators for consumer acceptance
        run: mise run local-plugins
      - name: Check complete consumer CLI workflow
        run: go run ./scripts/check-workflow --local-plugins .tools/plugins

  build:
    uses: ./.github/workflows/build.yaml
    with:
      version: v0.0.0-ci
