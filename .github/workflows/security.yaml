name: Go vulnerability check
on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
