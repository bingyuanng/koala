syntax = "proto3";

package order.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "github.com/bingyuanng/koala/examples/users/gen/go/order/v1;servicev1";

// OrderService is an application-owned API contract.
service OrderService {
  // Get retrieves a resource by ID. Replace this baseline operation as needed.
  rpc Get(GetRequest) returns (GetResponse) {
    option (google.api.http) = {get: "/v1/order/{id}"};
  }
}

// GetRequest identifies a resource.
message GetRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetResponse contains the resource identifier.
message GetResponse {
  string id = 1;
}
