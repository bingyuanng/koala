version: v2
plugins:
  - local: protoc-gen-go
    strategy: all
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    strategy: all
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-grpc-gateway
    strategy: all
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-openapiv2
    strategy: all
    out: gen/openapi
    opt:
      - allow_merge=true
      - merge_file_name=api
inputs:
  - directory: proto
